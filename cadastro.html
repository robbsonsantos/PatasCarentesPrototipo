<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Patas Carentes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="tailwind.config.js"></script>
  <script src="components.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md" data-nav="">
<site-header></site-header>
<main class="flex-grow bg-primary-container flex items-center justify-center p-gutter">
<div class="w-full max-w-[800px] bg-surface-container-low rounded-xl shadow-2xl p-xl md:p-[60px] flex flex-col md:flex-row gap-xl items-start relative overflow-hidden">
  <div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full -mr-16 -mt-16" aria-hidden="true"></div>
  <div class="flex flex-col items-center md:items-start w-full md:w-1/3">
    <label for="foto" class="cursor-pointer flex flex-col items-center md:items-start focus-within:outline focus-within:outline-2 rounded-full">
      <span id="foto-preview" class="w-32 h-32 md:w-48 md:h-48 bg-surface-container-highest rounded-full flex items-center justify-center border-4 border-surface shadow-sm mb-lg overflow-hidden">
        <span class="material-symbols-outlined text-[80px] md:text-[120px] text-outline-variant">person</span>
      </span>
      <span class="text-label-md font-label-md text-outline text-center md:text-left">Envie uma foto sua para o seu perfil</span>
      <input id="foto" name="foto" type="file" accept="image/*" class="sr-only" data-preview="foto-preview">
    </label>
  </div>
  <div class="flex-grow w-full">
    <h1 class="text-display-lg font-display-lg text-primary mb-xl">Crie seu cadastro.</h1>
    <form class="space-y-lg" data-redirect="index.html">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
        <div class="flex flex-col space-y-xs"><label class="text-label-md font-label-md text-primary" for="nome">Nome:</label><input class="w-full bg-surface-container-highest border-none rounded-lg focus:ring-2 focus:ring-primary h-12 px-md text-body-md" id="nome" name="nome" placeholder="Seu nome completo" type="text" autocomplete="name" required></div>
        <div class="flex flex-col space-y-xs"><label class="text-label-md font-label-md text-primary" for="telefone">Telefone:</label><input class="w-full bg-surface-container-highest border-none rounded-lg focus:ring-2 focus:ring-primary h-12 px-md text-body-md" id="telefone" name="telefone" placeholder="(00) 00000-0000" type="tel" autocomplete="tel" required></div>
      </div>
      <div class="flex flex-col space-y-xs"><label class="text-label-md font-label-md text-primary" for="endereco">Endereço:</label><input class="w-full bg-surface-container-highest border-none rounded-lg focus:ring-2 focus:ring-primary h-12 px-md text-body-md" id="endereco" name="endereco" placeholder="Rua, número, bairro e cidade" type="text" autocomplete="street-address" required></div>
      <div class="flex flex-col space-y-xs"><label class="text-label-md font-label-md text-primary" for="cpf">CPF:</label><input class="w-full bg-surface-container-highest border-none rounded-lg focus:ring-2 focus:ring-primary h-12 px-md text-body-md" id="cpf" name="cpf" placeholder="000.000.000-00" type="text" inputmode="numeric" required></div>
      <div class="flex flex-col space-y-xs">
        <label class="text-label-md font-label-md text-primary" for="sobre">Sobre você:</label>
        <textarea class="w-full bg-surface-container-highest border-none rounded-lg focus:ring-2 focus:ring-primary p-md text-body-md resize-none" id="sobre" name="sobre" placeholder="Conte-nos um pouco sobre você. Profissão, Hobbies e outros assuntos de seu interesse." rows="4"></textarea>
      </div>
      <div class="pt-lg"><button class="w-full bg-primary text-on-primary font-label-md text-label-md py-lg rounded-xl hover:shadow-lg transition-all active:scale-95 duration-150" type="submit">FINALIZAR CADASTRO</button></div>
      <p class="text-center text-body-md text-on-surface-variant">Já tem conta? <a href="login.html" class="font-bold text-primary hover:underline">Entrar</a></p>
    </form>
  </div>
</div>
</main>
<site-footer></site-footer>
<script src="script.js" defer></script>
</body>
</html>
